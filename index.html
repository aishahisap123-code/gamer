<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#050508; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; font-family:monospace;">
        <h1 style="font-size:60px; color:#cc2222; margin-bottom:10px; letter-spacing: 4px; text-shadow: 0 0 10px rgba(204,34,34,0.5);">GAMER</h1>
        <p style="font-size:16px; color:#777; margin-bottom:40px; letter-spacing: 1px;">An Escape Room Horror Experience</p>
        <button onclick="startGame()" style="padding:12px 35px; background:#111; color:#fff; border:2px solid #fff; font-size:20px; cursor:pointer; font-family:monospace; letter-spacing: 2px;">PLAY</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script src="game.js"></script>
    <script src="room0.js"></script>
    <script src="room1.js"></script>
</body>
</html>

<div id="noteModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:400px; background:#222; color:#fff; border:2px solid #fff; padding:20px; font-family:monospace; z-index:10; text-align:center;">
    <h3 id="noteTitle">Note</h3>
    <p id="noteContent" style="font-size:16px; margin:20px 0;"></p>
    <button onclick="closeNote()" style="padding:5px 15px; background:#444; color:#fff; border:1px solid #fff; cursor:pointer;">Close (Press Esc)</button>

</div>

<div id="keypadModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:300px; background:#1a1a1a; color:#0f0; border:2px solid #0f0; padding:20px; font-family:monospace; z-index:10; text-align:center;">
    <h3>SECURITY KEYPAD</h3>
    <p>Enter 3-Digit Code:</p>
    <input type="password" id="passcodeInput" maxlength="3" 
           onkeydown="if(event.key === 'Enter') submitCode()"
           style="width:100px; font-size:20px; text-align:center; background:#000; color:#0f0; border:1px solid #0f0; margin-bottom:15px;"><br>
    <button onclick="submitCode()" style="padding:5px 15px; background:#0f0; color:#000; font-weight:bold; cursor:pointer;">ENTER</button>
    <button onclick="closeKeypad()" style="padding:5px 15px; background:#444; color:#fff; border:1px solid #fff; cursor:pointer; margin-left:10px;">CANCEL</button>
</div>
